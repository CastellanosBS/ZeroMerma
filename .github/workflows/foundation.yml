name: Foundation

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [Preflight, Backend, Worker, Migrations, Contracts, Web, Browser, Negative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.4"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Prepare canonical dependencies
        shell: pwsh
        run: |
          corepack enable
          $manager = (Get-Content -Raw package.json | ConvertFrom-Json).packageManager
          corepack prepare (([string]$manager).Split("+")[0]) --activate
          ./scripts/dev/check-toolchain.ps1
          uv sync --all-packages --dev --frozen
          if ($LASTEXITCODE -ne 0) { throw "Frozen Python install failed" }
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Frozen Node install failed" }
      - name: Install isolated browser runtime
        if: matrix.stage == 'Web' || matrix.stage == 'Browser'
        run: corepack pnpm --filter @zeromerma/pos-web exec playwright install --with-deps chromium
      - name: Run canonical stage
        shell: pwsh
        run: ./scripts/dev/check-foundation.ps1 -Stage ${{ matrix.stage }}
      - name: Reject generated or accidental source changes
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) { throw "Validation changed source files: $($changes -join ', ')" }
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ matrix.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/validation/
            apps/*/playwright-report/
            apps/*/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  foundation:
    name: Foundation required
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation stage
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATION_RESULT" = success
