name: Foundation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test-build:
    # Linux Docker is required for the isolated postgres:16-alpine test harness.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Prepare Corepack and pnpm
        shell: pwsh
        run: |
          corepack enable
          $packageManager = (Get-Content -Raw package.json | ConvertFrom-Json).packageManager
          $pnpmSpec = ([string]$packageManager).Split("+")[0]
          corepack prepare $pnpmSpec --activate

      - name: Validate canonical toolchain
        shell: pwsh
        run: ./scripts/dev/check-toolchain.ps1

      - name: Install Python dependencies
        run: uv sync --all-packages --dev --frozen

      - name: Install Node dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run foundation validation
        shell: pwsh
        run: ./scripts/dev/check-foundation.ps1 -CiIsolated
