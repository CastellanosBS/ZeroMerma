[project]
name = "zeromerma-foundation"
version = "0.1.0"
description = "ZeroMerma greenfield monorepo foundation."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["zeromerma_api", "zeromerma_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "apps/api/tests",
  "apps/worker/tests",
]
pythonpath = [
  "apps/api/src",
  "apps/worker/src",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
  "apps/api/src",
  "apps/worker/src",
]
