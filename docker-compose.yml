services:
  postgres:
    image: postgres:16
    container_name: zeromerma-postgres
    environment:
      POSTGRES_USER: zeromerma
      POSTGRES_PASSWORD: zeromerma
      POSTGRES_DB: zeromerma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeromerma"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: zeromerma-redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    container_name: zeromerma-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
