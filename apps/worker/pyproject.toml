[project]
name = "zeromerma-worker"
version = "0.1.0"
description = "ZeroMerma independent transactional outbox worker."
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.3",
  "sqlalchemy>=2.0.36",
]

[project.scripts]
zeromerma-worker = "zeromerma_worker.main:main"

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
