[project]
name = "zeromerma-api"
version = "0.1.0"
description = "ZeroMerma FastAPI backend."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "email-validator>=2.2.0",
  "fastapi[standard]>=0.115.6",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.3",
  "sqlalchemy>=2.0.36",
]

[project.scripts]
zeromerma-api-openapi = "zeromerma_api.presentation.openapi:main"

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
