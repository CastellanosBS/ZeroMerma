[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ──────────────────────────────────────────────────────────────────────────────
# Proyect Metadata (Poetry Style)
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry]
name = "zeromerma-backend"
version = "0.1.0"
description = "FastAPI backend for ZeroMerma"
authors = ["CastellanosBS <scb.castellanos@gmail.com>"]
readme = "README.md"
packages = [{ include = "zeromerma_api", from = "src" }]

# ──────────────────────────────────────────────────────────────────────────────
# Runtime dependencies (prod)
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.1"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
pydantic = "^2.7.0"
pydantic-settings = "^2.10.1"

# ──────────────────────────────────────────────────────────────────────────────
# Development dependencies (excluded from production environments by default)
# ──────────────────────────────────────────────────────────────────────────────
[tool.poetry.group.dev.dependencies]
ruff = "^0.12.11"
black = "^25.1.0"
pytest = "^8.4.1"
pre-commit = "^4.3.0"

[tool.black]
line-length = 88
target-version = ["py312"]
